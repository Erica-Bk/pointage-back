spring.application.name=pointage-backend

# --- Database connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/pointage?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Your schema already exists (employee, category, salary, pointage), so Hibernate
# should not try to create or alter tables. Set to "validate" while developing if
# you want Hibernate to double-check the entities match the DB.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
